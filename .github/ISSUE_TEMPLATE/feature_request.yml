name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. A feature request should not assume a particular implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What limitation or user need motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you want and an example workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Who benefits, and what compatibility, security, or maintenance concerns may apply?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for a similar request.
          required: true
